<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="A hash map pointing into a doubly linked list ordered from most to least recently used">
  <g fill="none" stroke="#9ca3af" stroke-width="1.2" font-family="'Geist Mono', ui-monospace, monospace">
    <text x="0" y="14" fill="#6b7280" stroke="none" font-size="10" letter-spacing="1.4">HASH MAP</text>
    <text x="330" y="14" fill="#6b7280" stroke="none" font-size="10" letter-spacing="1.4">DOUBLY LINKED LIST / LRU ORDER</text>

    <!-- buckets -->
    <g>
      <rect x="0" y="28" width="70" height="26" rx="4"/>
      <text x="10" y="45" fill="#111" stroke="none" font-size="11">b0</text>
      <rect x="0" y="60" width="70" height="26" rx="4"/>
      <text x="10" y="77" fill="#111" stroke="none" font-size="11">b1</text>
      <rect x="0" y="92" width="70" height="26" rx="4"/>
      <text x="10" y="109" fill="#111" stroke="none" font-size="11">b2</text>
      <rect x="0" y="124" width="70" height="26" rx="4"/>
      <text x="10" y="141" fill="#9ca3af" stroke="none" font-size="11">b3</text>
    </g>

    <!-- pointers to nodes -->
    <path d="M70 41 C130 41 150 60 176 70" />
    <path d="M70 105 C120 105 150 92 176 84" />
    <circle cx="70" cy="41" r="2.2" fill="#111" stroke="none"/>
    <circle cx="70" cy="105" r="2.2" fill="#111" stroke="none"/>
    <circle cx="176" cy="70" r="2.2" fill="#111" stroke="none"/>
    <circle cx="176" cy="84" r="2.2" fill="#111" stroke="none"/>

    <!-- linked list nodes -->
    <g>
      <rect x="180" y="56" width="96" height="42" rx="6"/>
      <text x="192" y="74" fill="#111" stroke="none" font-size="12">"a"</text>
      <text x="192" y="89" fill="#6b7280" stroke="none" font-size="9">ttl 4s</text>

      <rect x="302" y="56" width="96" height="42" rx="6"/>
      <text x="314" y="74" fill="#111" stroke="none" font-size="12">"c"</text>
      <text x="314" y="89" fill="#6b7280" stroke="none" font-size="9">no ttl</text>

      <rect x="424" y="56" width="96" height="42" rx="6"/>
      <text x="436" y="74" fill="#111" stroke="none" font-size="12">"b"</text>
      <text x="436" y="89" fill="#6b7280" stroke="none" font-size="9">ttl 12s</text>
    </g>

    <!-- next / prev arrows -->
    <g stroke="#111" stroke-width="1.4" fill="none">
      <path d="M276 70 h22"/><path d="M294 66 l4 4 -4 4"/>
      <path d="M398 70 h22"/><path d="M416 66 l4 4 -4 4"/>
      <path d="M298 84 v0"/>
      <path d="M276 84 h-22"/><path d="M258 80 l-4 4 4 4"/>
      <path d="M398 84 h-22"/><path d="M380 80 l-4 4 4 4"/>
    </g>

    <!-- head / tail labels -->
    <text x="180" y="126" fill="#111" stroke="none" font-size="10">head · most recent</text>
    <text x="424" y="126" fill="#111" stroke="none" font-size="10">tail · next to evict</text>
    <path d="M180 112 v10" stroke="#111"/>
    <path d="M424 112 v10" stroke="#111"/>

    <!-- read path -->
    <text x="0" y="176" fill="#6b7280" stroke="none" font-size="10" letter-spacing="1.4">READ PATH</text>
    <text x="0" y="196" fill="#1f2937" stroke="none" font-size="11">hash(key) → bucket → node (O(1)) → move node to head → return value</text>
    <text x="0" y="216" fill="#6b7280" stroke="none" font-size="10" letter-spacing="1.4">WRITE PATH</text>
    <text x="0" y="236" fill="#1f2937" stroke="none" font-size="11">new node at head → if count &gt; capacity, unlink tail → delete its bucket entry</text>
  </g>
</svg>
